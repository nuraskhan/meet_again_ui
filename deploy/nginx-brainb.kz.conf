# Hangelo under https://brainb.kz/hangelo/
#
# brainb.kz is served by its own nginx; the application runs on Heroku. This block goes INSIDE the
# existing `server { ... }` of brainb.kz (the one with `listen 443 ssl`), next to its other
# `location` blocks, and hands everything under /hangelo/ to the application. Nothing else of the
# site is touched.
#
# The application already expects this path: it is built with base "/hangelo/" (vite.config.ts)
# and its server answers under /hangelo (server.js). So the path is passed on as it is - there is
# NO slash-rewrite here: `proxy_pass` has no path after the host on purpose.
#
# After adding it:   nginx -t && systemctl reload nginx
# Then check:        curl -I https://brainb.kz/hangelo/          -> 200
#                    curl -I https://brainb.kz/hangelo/api/actuator/health -> 200

location = /hangelo {
    return 301 /hangelo/;
}

location /hangelo/ {
    proxy_pass https://meet-again-ui-112b5408b3d1.herokuapp.com;

    # Heroku routes by the Host header and by the name in the TLS handshake: both must be the
    # application's own, not brainb.kz.
    proxy_set_header Host meet-again-ui-112b5408b3d1.herokuapp.com;
    proxy_ssl_server_name on;
    proxy_ssl_name meet-again-ui-112b5408b3d1.herokuapp.com;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # /hangelo/api/signal/stream stays open and is written into as things happen (new messages,
    # notifications). With buffering on, nginx would hold those back and nothing would arrive
    # until the stream closed. The server sends a keep-alive every 20 seconds, so a read timeout
    # well above that never cuts a healthy stream.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;

    # Profile photos are uploaded through here.
    client_max_body_size 12m;
}
